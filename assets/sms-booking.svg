<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 148" width="300" height="148" role="img" aria-label="Google Calendar confirmation: Dental check-up with Dr. Chen, Thursday 2pm">
  <!-- Compact booking confirmation, as it would land in the thread. Drawn in
       SVG so it stays crisp at any size and carries the actual booking from
       the conversation above it. -->
  <rect width="300" height="148" rx="14" fill="#FFFFFF"/>

  <!-- top rail with the app mark -->
  <rect x="0" y="0" width="300" height="34" fill="#F7F7F8"/>
  <path d="M0 34 L300 34" stroke="#EAEAEC" stroke-width="1"/>
  <!-- multi-colour "31" glyph as a stand-in for the Google Calendar mark -->
  <rect x="14" y="10" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/>
  <path d="M18 13h8" stroke="#4285F4" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M18 17.5h8" stroke="#EA4335" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M18 22h5" stroke="#34A853" stroke-width="1.4" stroke-linecap="round"/>
  <text x="38" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'General Sans', sans-serif" font-size="11" font-weight="500" fill="#3C4043" letter-spacing="-0.1">Google Calendar</text>
  <!-- checkmark badge on the right, confirming the invite was accepted -->
  <circle cx="278" cy="17" r="9" fill="#34A853"/>
  <path d="M274 17.4l2.6 2.4 5-4.8" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- coloured stripe on the left, the way Calendar tags an event -->
  <rect x="18" y="52" width="4" height="72" rx="2" fill="#039BE5"/>

  <!-- event details -->
  <text x="34" y="66" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'General Sans', sans-serif" font-size="14" font-weight="600" fill="#202124" letter-spacing="-0.2">Dental check-up · Kristie</text>
  <text x="34" y="86" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'General Sans', sans-serif" font-size="12" font-weight="400" fill="#3C4043">Thursday · 2:00–2:30 PM</text>

  <!-- meta lines with icons -->
  <g transform="translate(34,100)">
    <circle cx="6" cy="6" r="5.4" fill="none" stroke="#5F6368" stroke-width="1.2"/>
    <path d="M6 3v3.4l2 1.3" fill="none" stroke="#5F6368" stroke-width="1.2" stroke-linecap="round"/>
    <text x="18" y="10" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'General Sans', sans-serif" font-size="11" fill="#5F6368">Reminder set · 1 day before</text>
  </g>
  <g transform="translate(34,120)">
    <path d="M6 1a4 4 0 014 4c0 2.7-4 6-4 6S2 7.7 2 5a4 4 0 014-4z" fill="none" stroke="#5F6368" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="6" cy="5" r="1.4" fill="#5F6368"/>
    <text x="18" y="10" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'General Sans', sans-serif" font-size="11" fill="#5F6368">Parkview Dental · with Dr. Chen</text>
  </g>
</svg>
